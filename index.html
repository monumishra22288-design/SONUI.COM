<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sonu | Official Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090014, #18002f, #00152f);
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            border: 4px solid white;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .username {
            color: #bbb;
            margin-bottom: 15px;
        }

        .bio {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: white;
            padding: 15px;
            margin: 14px 0;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .instagram {
            background: linear-gradient(45deg, #feda75, #d62976, #962fbf, #4f5bd5);
        }

        .telegram {
            background: #229ED9;
        }

        .website {
            background: #222;
            border: 1px solid #444;
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">S</div>

        <h1>SONU</h1>

        <div class="username">
            @sonu1122334
        </div>

        <p class="bio">
            👋 Welcome to my official website!<br>
            💻 Web Developer & Tech Enthusiast<br>
            🚀 Follow me and join my community.
        </p>

        <!-- Instagram -->
        <a
            class="button instagram"
            href="https://instagram.com/sonu1122334"
            target="_blank">
            📸 Follow me on Instagram
        </a>

        <!-- Telegram -->
        <a
            class="button telegram"
            href="https://t.me/YOUR_TELEGRAM_USERNAME"
            target="_blank">
            ✈️ Join my Telegram
        </a>

        <div class="button website">
            🌐 Sonu Official
        </div>

        <footer>
            © 2026 Sonu • All Rights Reserved
        </footer>

    </div>

</body>
</html>
